[project]
name = "sci-paper-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eike", email = "eikef.rades@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
]

[project.scripts]
sci-paper-mcp = "sci_paper_mcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits real APIs; excluded from CI, run with `pytest -m live`"]
